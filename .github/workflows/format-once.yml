name: Temporary pipi v0.3 source formatter
on:
  push:
    branches: ["feat/color-tui-menu-forms"]
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/color-tui-menu-forms
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Run rustfmt and push only formatting changes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: rustfmt all Rust source for pipi 0.3"
            git push origin HEAD:feat/color-tui-menu-forms
          fi
