name: Apply rustfmt to implementation branch (temporary)
on:
  push:
    branches: [feat/rust-linux-ping-engine]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'derdigitalaffine/piping'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical rustfmt and commit only changed Rust files
        run: |
          cargo fmt --all
          git add -- src tests
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply canonical rustfmt to Rust sources"
          git push origin HEAD:feat/rust-linux-ping-engine
