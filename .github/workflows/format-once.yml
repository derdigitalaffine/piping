name: Temporary rustfmt for pipi after Clippy fixes
on:
  push:
    branches: ["feat/mtr-trace-tui-neighborhood"]
permissions:
  contents: write
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mtr-trace-tui-neighborhood
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply cargo fmt to Rust source and CLI tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: cargo fmt after unified FFI changes"
            git push origin HEAD:feat/mtr-trace-tui-neighborhood
          fi
